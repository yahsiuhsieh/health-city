<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleep Voyage Card</title>
<style>
:root{
  --page:#e9f1ef; --surface:#fbfcfa; --raised:#ffffff; --line:#e1e9e6; --line-strong:#cfdad6;
  --ink:#1d3833; --ink-2:#4b6560; --ink-3:#7b8f8a; --accent:#2e5e4e;
  --rem:#29b0a0; --light:#4479d6; --deep:#5a3aa6; --awake:#e0862f; --unclassified:#8e979f;
  --radius:16px; --gap:24px;
  font-family:"Avenir Next",Avenir,"Segoe UI",sans-serif; color:var(--ink); background:var(--page);
  font-synthesis:none; -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
body{margin:0;padding:32px 16px 64px;background:var(--page)}
.frame-label{max-width:760px;margin:0 auto 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.card{max-width:760px;margin:0 auto 40px;background:var(--surface);border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(20,40,36,.06),0 12px 32px rgba(20,40,36,.10);padding:24px 28px 28px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.title{margin:0;font-size:20px;font-weight:600;line-height:1.25}
.meta{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.close{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);
  color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer}
.close:focus{outline:none}.close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:6px 12px 6px 10px;border-radius:999px;
  background:#eef3f8;font-size:13px;color:var(--ink)}
.status i{width:8px;height:8px;border-radius:50%}
.status b{font-weight:600}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px;margin-top:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hero-value{margin:0;font-size:40px;font-weight:600;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero-value small{font-size:18px;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.hero-sub{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.island{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised)}
.island svg{flex:none}
.island dt{font-size:12px;color:var(--ink-3)}
.island dd{margin:2px 0 0;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
section{margin-top:22px}
h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.stack span{display:block;height:100%}
.stack span:first-child{border-radius:6px 0 0 6px}.stack span:last-child{border-radius:0 6px 6px 0}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:10px 1fr;column-gap:8px;row-gap:2px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px}
.legend .name{font-size:13px;color:var(--ink-2)}
.legend .value{grid-column:2;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.legend .share{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:14px}
.hypno{position:relative}
.hypno svg{display:block;width:100%;height:auto;overflow:visible}
.row-label{font-size:12px;fill:var(--ink-2)}
.axis{font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.grid{stroke:var(--line);stroke-width:1}
.riser{stroke:#c4d1cd;stroke-width:1.5}
.seg{cursor:pointer}
.seg:hover rect,.seg:focus rect{filter:brightness(1.08)}
.seg:focus{outline:none}
.future{fill:url(#hatch)}
.cursor{stroke:var(--ink);stroke-width:1.5}
.cursor-label rect{fill:var(--ink)}.cursor-label text{fill:#fff;font-size:11px;font-weight:600}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%);margin-top:-10px;padding:8px 10px;border-radius:8px;
  background:var(--ink);color:#fff;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);display:none}
.tip b{display:block;font-size:13px}
.lower{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--gap);margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.lower section{margin:0}
.map{border:1px solid var(--line);border-radius:12px;background:#eef4f6;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.facts{margin:0;display:grid;gap:12px}
.facts div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0;padding-bottom:0}
.facts dt{font-size:13px;color:var(--ink-2)}
.facts dd{margin:0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.facts dd small{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}
.reveal{transform-origin:50% 0}
@keyframes sharpen{from{filter:blur(8px);opacity:.35;transform:translateY(12px)}to{filter:none;opacity:1;transform:none}}
@supports (animation-timeline: view()){
  .reveal{animation:sharpen linear both;animation-timeline:view();animation-range:entry 0% entry 70%}
}
@supports not (animation-timeline: view()){
  .reveal{filter:blur(calc(8px * (1 - var(--p,1))));opacity:calc(.35 + .65 * var(--p,1));transform:translateY(calc(12px * (1 - var(--p,1))))}
}
.reveal:focus-within{animation:none;filter:none;opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{animation:none!important;filter:none!important;opacity:1!important;transform:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  body{padding:0}
  .frame-label{margin:16px 16px 8px}
  .card{border-radius:20px 20px 0 0;padding:12px 16px 24px;margin-bottom:24px}
  .card::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 14px}
  .hero{grid-template-columns:1fr}
  .island{justify-self:start}
  .hero-value{font-size:34px}
  .legend{grid-template-columns:1fr;gap:10px}
  .legend li{grid-template-columns:10px auto 1fr;align-items:baseline}
  .legend .value{grid-column:auto;text-align:right}
  .lower{grid-template-columns:1fr}
}
</style>
</head>
<body>

<p class="frame-label">State A · after arrival (replay 07:00)</p>
<article class="card" id="cardA" aria-label="Sleep voyage"></article>

<p class="frame-label">State B · during the voyage (replay 05:26)</p>
<article class="card" id="cardB" aria-label="Sleep voyage"></article>

<div class="tip" id="tip"></div>

<script>
// Synthetic session: departs Wed Nov 11 at 23:00 Chicago time.
const START=23*60;
const SEG=[["LIGHT",60],["DEEP",85],["REM",40],["LIGHT",55],["AWAKE",8],["LIGHT",52],["DEEP",65],["REM",50],["LIGHT",35]];
const ROW={AWAKE:0,REM:1,LIGHT:2,DEEP:3,ASLEEP:2};
const NAME={AWAKE:"Awake",REM:"REM",LIGHT:"Light",DEEP:"Deep",ASLEEP:"Unclassified"};
const COLOR={AWAKE:"var(--awake)",REM:"var(--rem)",LIGHT:"var(--light)",DEEP:"var(--deep)",ASLEEP:"var(--unclassified)"};
let t=0;const spans=SEG.map(([stage,m])=>{const s={stage,start:t,end:t+m};t+=m;return s;});
const TOTAL=t;
const clock=m=>{const v=(START+m)%1440;return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0");};
const hm=m=>Math.floor(m/60)+" h "+String(Math.round(m%60)).padStart(1,"0")+" min";
function totals(until){
  const r={LIGHT:0,DEEP:0,REM:0,ASLEEP:0,AWAKE:0,count:0};
  for(const s of spans){const e=Math.min(s.end,until);if(e<=s.start)continue;r[s.stage]+=e-s.start;if(s.stage==="AWAKE")r.count++;}
  r.asleep=r.LIGHT+r.DEEP+r.REM+r.ASLEEP;return r;
}

function hypnogram(until,W=700){
  const L=W<480?48:64,R=8,top=8,rowH=22,gap=8,H=top+4*(rowH+gap)+22;
  const x=m=>L+(W-L-R)*m/TOTAL,y=r=>top+r*(rowH+gap);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Sleep stage timeline">
  <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <rect width="6" height="6" fill="#f1f5f4"/><path d="M0 0V6" stroke="#dfe7e4" stroke-width="2"/></pattern></defs>`;
  ["Awake","REM","Light","Deep"].forEach((n,i)=>{g+=`<text class="row-label" x="0" y="${y(i)+rowH/2+4}">${n}</text>`;});
  g+=`<text class="axis" x="${x(0)}" y="${H-2}" text-anchor="start">${clock(0)}</text>`;
  for(let m=60-START%60;m<=TOTAL;m+=(W<480?120:60)){g+=`<line class="grid" x1="${x(m)}" x2="${x(m)}" y1="${top-4}" y2="${y(3)+rowH+4}"/>
    ${x(m)-x(0)<40?"":`<text class="axis" x="${x(m)}" y="${H-2}" text-anchor="middle">${clock(m)}</text>`}`;}
  const shown=spans.filter(s=>s.start<until);
  shown.forEach((s,i)=>{const n=shown[i+1];if(!n)return;const xx=x(n.start);
    g+=`<line class="riser" x1="${xx}" x2="${xx}" y1="${y(ROW[s.stage])+rowH/2}" y2="${y(ROW[n.stage])+rowH/2}"/>`;});
  shown.forEach(s=>{const e=Math.min(s.end,until),x0=x(s.start),w=Math.max(4,x(e)-x0-1),r=ROW[s.stage];
    const label=`${NAME[s.stage]} · ${clock(s.start)}–${clock(s.end)} · ${s.end-s.start} min`;
    g+=`<g class="seg" tabindex="0" role="button" aria-label="${label}" data-tip="${NAME[s.stage]}|${clock(s.start)}–${clock(s.end)} · ${s.end-s.start} min">
      <rect x="${x0}" y="${y(r)}" width="${w}" height="${rowH}" rx="4" fill="${COLOR[s.stage]}"/></g>`;
    if(s.stage==="AWAKE")g+=`<g transform="translate(${x0+w/2} ${y(0)-1})" aria-hidden="true"></g>`;});
  if(until<TOTAL){g+=`<rect class="future" x="${x(until)}" y="${top-4}" width="${x(TOTAL)-x(until)}" height="${y(3)+rowH+8-top}" rx="4"/>
    <line class="cursor" x1="${x(until)}" x2="${x(until)}" y1="${top-6}" y2="${y(3)+rowH+6}"/>
    <g class="cursor-label" transform="translate(${x(until)} ${top-6})"><rect x="-22" y="-16" width="44" height="16" rx="4"/><text y="-4.5" text-anchor="middle">${clock(until)}</text></g>`;}
  return g+"</svg>";
}

function routeMap(until){
  // Schematic chart: harbor at the left, outer reef in the middle, island at the right.
  const pts=[[46,128],[96,128],[150,118],[196,92],[232,58],[262,42],[306,48],[352,60],[380,94],[370,130],[342,146],[318,146]];
  const len=pts.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);
  const at=f=>{let d=f*len;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l)return [a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l];d-=l;}return pts.at(-1);};
  const asleep=totals(TOTAL).asleep,sofar=m=>{let a=0;for(const s of spans){if(s.stage==="AWAKE")continue;a+=Math.max(0,Math.min(s.end,m)-s.start);}return a/asleep;};
  let g=`<svg viewBox="0 0 400 170" role="img" aria-label="Route from the city harbor to the sleep island">
    <rect width="400" height="170" fill="#eef4f6"/>
    <path d="M0 0H34Q46 40 30 80T38 170H0Z" fill="#e6e1cf" stroke="#cdd8d4"/>
    <path d="M34 112H70V146H34" fill="none" stroke="#9aa9a5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M190 128Q214 96 236 82Q248 74 252 86Q240 104 214 134Q198 150 190 128Z" fill="#d7ebe9" stroke="#b9d6d3"/>
    <ellipse cx="318" cy="104" rx="56" ry="34" fill="#d7ebe9" stroke="#b9d6d3"/>
    <ellipse cx="324" cy="102" rx="24" ry="13" fill="#e6e1cf" stroke="#cbc4ab"/>
    <path d="M320 112V141" stroke="#9aa9a5" stroke-width="2"/>
    <text x="8" y="160" font-size="11" fill="#4b6560">Harbor</text>
    <text x="392" y="160" font-size="11" fill="#4b6560" text-anchor="end">Sleep island</text>
    <text x="222" y="152" font-size="10" fill="#7b8f8a" text-anchor="middle">Outer reef</text>
    <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#c9d6d2" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>`;
  for(const s of spans){if(s.stage==="AWAKE"||s.start>=until)continue;
    const f0=sofar(s.start),f1=sofar(Math.min(s.end,until)),n=24,seg=[];
    for(let i=0;i<=n;i++)seg.push(at(f0+(f1-f0)*i/n).map(v=>v.toFixed(1)).join(","));
    g+=`<polyline points="${seg.join(" ")}" fill="none" stroke="#fbfcfa" stroke-width="7" stroke-linecap="round"/>
      <polyline points="${seg.join(" ")}" fill="none" stroke="${COLOR[s.stage]}" stroke-width="4" stroke-linecap="round"/>`;}
  for(const s of spans){if(s.stage!=="AWAKE"||s.start>until)continue;const [ax,ay]=at(sofar(s.start));
    g+=`<circle cx="${ax}" cy="${ay}" r="5.5" fill="#fff" stroke="var(--awake)" stroke-width="2"/>`;}
  const [bx,by]=at(sofar(until));
  g+=`<g transform="translate(${bx} ${by})"><circle r="8" fill="#fff" stroke="#1d3833" stroke-width="1.5"/><path d="M-4-2.5H1.5L5 0 1.5 2.5H-4Z" fill="#a8513b"/></g>`;
  return g+"</svg>";
}

function card(el,until){
  const done=until>=TOTAL,r=totals(until),share=v=>Math.round(v*1000/r.asleep)/10;
  const current=spans.find(s=>until>=s.start&&until<s.end);
  const stages=["LIGHT","DEEP","REM","ASLEEP"].filter(k=>r[k]>0);
  el.innerHTML=`
  <header class="head"><div>
    <p class="eyebrow">Sleep voyage</p>
    <h2 class="title">Night of Wed, Nov 11</h2>
    <p class="meta">23:00 → 06:30 Thu · America/Chicago</p>
  </div><button class="close" aria-label="Close sleep voyage">×</button></header>
  ${done?"":`<div class="status" role="status"><i style="background:${COLOR[current.stage]}"></i><b>${NAME[current.stage]}</b> since ${clock(current.start)} · replay ${clock(until)}</div>`}
  <div class="hero"><div>
    <p class="hero-value">${hm(r.asleep)}<small>${done?"asleep":"asleep so far"}</small></p>
    <p class="hero-sub">${hm(Math.min(until,TOTAL))} ${done?"in bed":"since departure"} · ${r.count} awakening${r.count===1?"":"s"}${r.count?", "+r.AWAKE+" min":""}</p>
  </div><dl class="island">
    <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><ellipse cx="17" cy="12" rx="16" ry="9" fill="#d7ebe9"/><ellipse cx="18" cy="11" rx="8" ry="4.5" fill="#e6e1cf"/><circle cx="16" cy="9" r="3" fill="#5b8a55"/></svg>
    <div><dt>${done?"Island":"Island on arrival"}</dt><dd>${done?(r.asleep*24).toLocaleString("en-US")+" m²":"06:30"}</dd></div></dl></div>
  <section class="reveal" aria-labelledby="${el.id}-stages"><h3 id="${el.id}-stages">Stages</h3>
    <div class="stack" aria-hidden="true">${stages.map(k=>`<span style="flex:${r[k]};background:${COLOR[k]}"></span>`).join("")}</div>
    <ul class="legend">${stages.map(k=>`<li><i style="background:${COLOR[k]}"></i><span class="name">${NAME[k]}</span>
      <span class="value">${hm(r[k])}<span class="share">${share(r[k])}%</span></span></li>`).join("")}</ul>
    <table class="sr"><caption>Stage minutes</caption>${stages.map(k=>`<tr><th>${NAME[k]}</th><td>${r[k]} min</td><td>${share(r[k])}%</td></tr>`).join("")}</table>
  </section>
  <section class="reveal" aria-labelledby="${el.id}-timeline"><h3 id="${el.id}-timeline">Timeline</h3><div class="hypno">${hypnogram(until,Math.max(300,Math.round(el.clientWidth-(innerWidth<=640?32:56))))}</div></section>
  <div class="lower reveal">
    <section aria-labelledby="${el.id}-route"><h3 id="${el.id}-route">Route</h3><div class="map">${routeMap(until)}</div></section>
    <section aria-labelledby="${el.id}-facts"><h3 id="${el.id}-facts">Details</h3><dl class="facts">
      <div><dt>Sleep start</dt><dd>23:00</dd></div>
      <div><dt>Woke up</dt><dd>${done?"06:30":"—"}</dd></div>
      <div><dt>Awakenings</dt><dd>${r.count?`${clock(spans[4].start)} <small>${r.AWAKE} min · boat anchored</small>`:"None"}</dd></div>
      <div><dt>Route</dt><dd>0.9 km<small>Harbor to island</small></dd></div>
    </dl></section>
  </div>`;
}
const render=()=>{card(document.getElementById("cardA"),TOTAL);card(document.getElementById("cardB"),6*60+26);};
render();addEventListener("resize",render);
// Fallback for browsers without scroll-driven animations.
if(!CSS.supports("animation-timeline: view()")){
  const io=new IntersectionObserver(es=>es.forEach(e=>e.target.style.setProperty("--p",Math.min(1,e.intersectionRatio/.7).toFixed(3))),
    {threshold:Array.from({length:21},(_,i)=>i/20)});
  const watch=()=>document.querySelectorAll(".reveal").forEach(n=>io.observe(n));watch();addEventListener("resize",watch);
}

const tip=document.getElementById("tip");
document.addEventListener("pointerover",e=>{
  const g=e.target.closest(".seg");if(!g){tip.style.display="none";return;}
  const [a,b]=g.dataset.tip.split("|"),box=g.getBoundingClientRect();
  tip.innerHTML=`<b>${a}</b>${b}`;tip.style.left=(box.left+box.width/2+scrollX)+"px";tip.style.top=(box.top+scrollY)+"px";tip.style.display="block";
});
</script>
</body>
</html>
