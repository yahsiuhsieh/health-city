<div id="hc-details">
  <div class="hd-controls" aria-label="Detail study viewing controls">
    <div><button type="button" data-view="harbor" aria-pressed="true">Harbor</button><button type="button" data-view="building" aria-pressed="false">Building detail</button><button type="button" data-view="boat" aria-pressed="false">Boat detail</button></div>
    <div><button type="button" data-night="false" aria-pressed="true">Soft daylight</button><button type="button" data-night="true" aria-pressed="false">Night</button></div>
  </div>
  <div class="viz-carousel" aria-label="HealthCity shape and detail studies">
    <section data-variant="Crafted quay" aria-label="Crafted quay">
      <div class="hd-view" data-style="craft" role="img" aria-label="Detailed harbor workshop with individual roof tiles, timber window frames, striped awning, balcony railings, drainpipes, signs, plant pots, a planked dock, and a shaped boat with railings and rigging."></div>
      <div class="hd-caption"><strong>Crafted quay</strong><span>Layered street architecture · timber · tiles · painted plaster</span></div>
    </section>
    <section data-variant="Sculpted arcade" aria-label="Sculpted arcade" hidden>
      <div class="hd-view" data-style="arcade" role="img" aria-label="Detailed sculptural architecture with deep arched openings, curved parapets, bronze louvers, mosaic bands, roof garden, and a rounded harbor boat with structural details."></div>
      <div class="hd-caption"><strong>Sculpted arcade</strong><span>Deep arches · curved silhouette · louvers · mosaic bands</span></div>
    </section>
    <section data-variant="Folded atlas" aria-label="Folded atlas" hidden>
      <div class="hd-view" data-style="atlas" role="img" aria-label="Detailed asymmetric folded-roof harbor building with contour patterns, rounded bay windows, ribbed roofs, scalloped canopy, and a boat with a faceted curved hull and full deck details."></div>
      <div class="hd-caption"><strong>Folded atlas</strong><span>Asymmetric roofs · contour patterns · ribbing · graphic water</span></div>
    </section>
  </div>
  <div class="hd-status" aria-live="polite">Proposed assets · drag to orbit · scroll to zoom</div>
</div>
<style>
#hc-details{font:14px/1.5 system-ui,sans-serif;color:light-dark(#2f4548,#e7efed);color-scheme:light dark}
#hc-details .hd-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-right:80px;margin-bottom:12px}
#hc-details .hd-controls>div{display:flex;gap:6px;flex-wrap:wrap}
#hc-details button{font:inherit;background:light-dark(#e9eeeb,#2b3f43);color:inherit;border:1px solid light-dark(#c5d2cc,#536a6e);border-radius:6px;padding:6px 10px}
#hc-details button[aria-pressed="true"]{background:light-dark(#355a56,#b6d3c8);color:light-dark(#fff,#213b35)}
#hc-details .hd-view{height:540px;width:100%;overflow:hidden;border-radius:10px;background:#b3c8c7;touch-action:none}
#hc-details canvas{display:block;width:100%;height:100%}
#hc-details .hd-caption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
#hc-details strong{font-weight:500}
#hc-details .hd-caption span,#hc-details .hd-status{font-size:12px;opacity:.83}
#hc-details .hd-status{margin-top:8px}
@media(max-width:480px){#hc-details .hd-view{height:420px}#hc-details .hd-caption{display:block}#hc-details .hd-caption span{display:block}}
@media(pointer:coarse){#hc-details button{min-height:44px}}
</style>
