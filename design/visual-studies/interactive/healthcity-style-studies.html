<div id="hc-styles">
  <div class="hc-study-controls" aria-label="Style preview controls">
    <button type="button" data-light="day" aria-pressed="true">Day</button>
    <button type="button" data-light="night" aria-pressed="false">Night</button>
    <button type="button" id="hc-motion" aria-pressed="false">Play motion</button>
    <span>Style study · synthetic scene</span>
  </div>
  <div class="viz-carousel" aria-label="HealthCity style studies">
    <section data-variant="Soft sculpted" aria-label="Soft sculpted miniature">
      <div class="hc-view" data-style="soft" role="img" aria-label="A rounded miniature harbor with soft mountains, houses, trees, a boat, and a ridge train. Drag to orbit and scroll to zoom."></div>
      <div class="hc-caption"><strong>Soft sculpted</strong><span>Rounded forms · satin surfaces · quiet water</span></div>
    </section>
    <section data-variant="Faceted diorama" aria-label="Faceted diorama" hidden>
      <div class="hc-view" data-style="faceted" role="img" aria-label="The same harbor in a faceted low-poly style, with angular terrain and geometric water. Drag to orbit and scroll to zoom."></div>
      <div class="hc-caption"><strong>Faceted diorama</strong><span>Angular terrain · geometric foliage · planar water</span></div>
    </section>
    <section data-variant="Coastal storybook" aria-label="Coastal storybook miniature" hidden>
      <div class="hc-view" data-style="coastal" role="img" aria-label="The same harbor with beveled buildings, roof detail, layered vegetation, shoreline foam, and richer water. Drag to orbit and scroll to zoom."></div>
      <div class="hc-caption"><strong>Coastal storybook</strong><span>Beveled architecture · layered plants · shoreline detail</span></div>
    </section>
  </div>
  <p id="hc-status" aria-live="polite">Drag to orbit · scroll to zoom · right-drag to pan</p>
</div>
<style>
#hc-styles{color-scheme:light dark;color:light-dark(#243c41,#e6edef);font:14px/1.5 system-ui,sans-serif}
#hc-styles .hc-study-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-right:80px}
#hc-styles button{font:inherit;color:inherit;background:light-dark(#eaf0ef,#263a41);border:1px solid light-dark(#c8d7d4,#4a6268);padding:6px 12px;border-radius:6px}
#hc-styles button[aria-pressed="true"]{background:light-dark(#2a5355,#b3d4cd);color:light-dark(#fff,#183331)}
#hc-styles .hc-study-controls span{font-size:12px;opacity:.8}
#hc-styles .hc-view{width:100%;height:460px;overflow:hidden;background:#bed4d4;border-radius:9px;touch-action:none}
#hc-styles .hc-view canvas{display:block;width:100%;height:100%}
#hc-styles .hc-caption{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
#hc-styles .hc-caption strong{font-weight:500}
#hc-styles .hc-caption span,#hc-styles #hc-status{font-size:12px;opacity:.85}
#hc-styles #hc-status{margin:8px 0 0}
@media(max-width:480px){#hc-styles .hc-view{height:350px}#hc-styles .hc-caption{display:block}#hc-styles .hc-caption span{display:block}}
</style>
