<div id="hc-skyline">
  <div class="hs-controls" aria-label="Skyline study controls">
    <div><button type="button" data-view="city" aria-pressed="true">Skyline</button><button type="button" data-view="street" aria-pressed="false">Street detail</button><button type="button" data-view="harbor" aria-pressed="false">Waterfront detail</button></div>
    <div><button type="button" data-night="false" aria-pressed="true">Day</button><button type="button" data-night="true" aria-pressed="false">Night</button></div>
  </div>
  <div class="viz-carousel" aria-label="HealthCity skyline and waterfront compositions">
    <section data-variant="Skyline terraces" aria-label="Skyline terraces composition">
      <div class="hs-view" data-preset="terraces" role="img" aria-label="Terraced modern skyscrapers, a two-deck passenger ferry, layered rounded trees, a marina with finger piers, and a landscaped boulevard."></div><div class="hs-parts" aria-live="polite"></div>
    </section>
    <section data-variant="Canal metropolis" aria-label="Canal metropolis composition" hidden>
      <div class="hs-view" data-preset="canals" role="img" aria-label="Brick and stone high-rises, a working tugboat, broadleaf trees, a working wharf with a crane, and streets divided by canals and bridges."></div><div class="hs-parts" aria-live="polite"></div>
    </section>
    <section data-variant="Deco coast" aria-label="Deco coast composition" hidden>
      <div class="hs-view" data-preset="deco" role="img" aria-label="Stepped Art Deco towers, a sailing yacht, palm trees, a stepped waterfront amphitheater, and a tram boulevard."></div><div class="hs-parts" aria-live="polite"></div>
    </section>
  </div>
  <div class="hs-status" aria-live="polite">Art study · no health-data mappings · drag to orbit · scroll to zoom</div>
</div>
<style>
#hc-skyline{font:14px/1.5 system-ui,sans-serif;color:light-dark(#2c4347,#e6efec);color-scheme:light dark}
#hc-skyline .hs-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-right:80px}
#hc-skyline .hs-controls>div{display:flex;gap:6px;flex-wrap:wrap}
#hc-skyline button{font:inherit;color:inherit;background:light-dark(#e7eeea,#2d4144);border:1px solid light-dark(#c3d0cb,#526a6d);border-radius:6px;padding:6px 10px}
#hc-skyline button[aria-pressed="true"]{background:light-dark(#355c56,#b9d5c9);color:light-dark(#fff,#203b35)}
#hc-skyline .hs-view{height:570px;width:100%;overflow:hidden;border-radius:10px;background:#a9c1c2;touch-action:none}
#hc-skyline canvas{display:block;width:100%;height:100%}
#hc-skyline .hs-parts{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px}
#hc-skyline .hs-parts span,#hc-skyline .hs-status{font-size:12px;opacity:.87}
#hc-skyline .hs-parts b{font-weight:500}
#hc-skyline .hs-status{margin-top:8px}
@media(max-width:480px){#hc-skyline .hs-view{height:440px}}
@media(pointer:coarse){#hc-skyline button{min-height:44px}}
</style>
