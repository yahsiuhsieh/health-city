<div id="hc-sculpted">

    <button class="btn" type="button" data-focus="architecture" aria-pressed="false">建築近景</button>
    <button class="btn" type="button" data-focus="boat" aria-pressed="false">船隻近景</button>
    <button class="btn" type="button" data-focus="trees" aria-pressed="false">植栽近景</button>

  <div class="viz-carousel" aria-label="圓雕手作風格研究" data-previous-label="上一個場景" data-next-label="下一個場景">

    </section>
  </div>
  <div class="hc-bottom">
    <span class="text-small text-muted" data-status aria-live="polite">模型載入中</span>
    <div class="hc-actions">

      <label class="form-check"><input class="form-check-input" type="checkbox" data-motion><span class="form-check-label">微動態</span></label>
    </div>
  </div>
</div>
<style>

  const instance={kind,stage,scene,camera,controls,renderer,composer,ao,moving,dirty:true,

}

function persist(){window.openai?.setWidgetState?.({modelContent:{study:'sculpted-D',focus:state.focus,motion:state.motion},privateContent:null})?.catch(()=>{})}
function updateControls(){root.querySelectorAll('[data-focus]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.focus===state.focus)));root.querySelector('[data-motion]').checked=state.motion}
root.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{state.focus=b.dataset.focus;instances.forEach(s=>s.focus());updateControls();persist()}));

function ensure(){
  for(const stage of root.querySelectorAll('.hc-stage')){

    try{build(stage);root.querySelector('[data-status]').textContent='拖曳旋轉 · 滾輪縮放 · 右鍵平移'}catch(e){stage.dataset.ready='error';root.querySelector('[data-status]').textContent='無法載入 3D 預覽：'+e.message;root.querySelector('[data-status]').setAttribute('role','alert');console.error(e)}

updateControls();ensure();new MutationObserver(ensure).observe(root.querySelector('.viz-carousel'),{subtree:true,attributes:true,attributeFilter:['hidden','style','class']});
const scheme=matchMedia('(prefers-color-scheme: dark)');scheme.addEventListener('change',()=>instances.forEach(s=>s.theme()));
const reduced=matchMedia('(prefers-reduced-motion: reduce)');

let previous=0,wasMoving=false;
function frame(now){
  requestAnimationFrame(frame);if(document.hidden||now-previous<32)return;previous=now;
  for(const s of instances){
    if(!s.stage.getClientRects().length)continue;s.controls.update();
    const animate=state.motion&&!reduced.matches;
    if(animate||wasMoving){for(const item of s.moving){item.object.position.y=item.base+(animate?Math.sin(now*.0009+item.phase)*.024:0);item.object.rotation.z=animate?Math.sin(now*.0007+item.phase)*.006:0}s.dirty=true}
    if(s.dirty){s.composer.render();s.dirty=false}
  }wasMoving=state.motion&&!reduced.matches;
}
requestAnimationFrame(frame);
</script>
