<div id="hc-bold">
  <div class="hb-controls" aria-label="Style preview controls">
    <button type="button" data-time="day" aria-pressed="true">Day</button>
    <button type="button" data-time="night" aria-pressed="false">Night</button>
    <button type="button" data-motion aria-pressed="false">Play motion</button>

  <div class="viz-carousel" aria-label="HealthCity bold art directions">
    <section data-variant="Porcelain bay" aria-label="Porcelain bay">
      <div class="hb-view" data-style="porcelain" role="img" aria-label="A luminous porcelain harbor, with modern white villas, ochre pergolas, turquoise water, soft layered trees, and a continuous smooth ridge carrying a small train."></div>
      <div class="hb-caption"><strong>Porcelain bay</strong><span>Sculpted terraces · modern villas · luminous turquoise</span></div>
    </section>
    <section data-variant="Living atlas" aria-label="Living atlas" hidden>
      <div class="hb-view" data-style="atlas" role="img" aria-label="An illustrated three-dimensional landscape with flowing contour lines, coral and blue pavilions, graphic water ribbons, rounded trees, and a continuous heart-rate ridge."></div>
      <div class="hb-caption"><strong>Living atlas</strong><span>Flowing contours · folded roofs · graphic water</span></div>
    </section>
    <section data-variant="Emerald sanctuary" aria-label="Emerald sanctuary" hidden>
      <div class="hb-view" data-style="forest" role="img" aria-label="A dense forest harbor with wooden cabins and bridges, jade water, mossy rolling hills, rounded layered trees, and a small ridge train. Night mode illuminates the harbor windows."></div>
      <div class="hb-caption"><strong>Emerald sanctuary</strong><span>Forest canopy · timber boardwalks · jade lagoon</span></div>
    </section>
  </div>
  <div class="hb-footer" aria-live="polite">Drag to orbit · scroll to zoom · right-drag to pan</div>
</div>
<style>
#hc-bold{font:14px/1.5 system-ui,sans-serif;color:light-dark(#263f43,#e4efed);color-scheme:light dark}
#hc-bold .hb-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-right:80px;margin-bottom:12px}
#hc-bold button{font:inherit;color:inherit;background:light-dark(#edf1ee,#293f43);border:1px solid light-dark(#c5d4d1,#526b6e);padding:6px 12px;border-radius:6px}
#hc-bold button[aria-pressed="true"]{background:light-dark(#2e5857,#b4d5cc);color:light-dark(#fff,#203a36)}

#hc-bold .hb-view{height:520px;width:100%;overflow:hidden;border-radius:10px;background:#b9d9d7;touch-action:none}

#hc-bold .hb-caption{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}

@media(max-width:480px){#hc-bold .hb-view{height:380px}#hc-bold .hb-caption{display:block}#hc-bold .hb-caption span{display:block}}
@media(pointer:coarse){#hc-bold button{min-height:44px}}
