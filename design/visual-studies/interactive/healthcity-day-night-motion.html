<div id="hc-day-night">
  <div class="hc-toolbar" aria-label="場景控制">
    <div class="hc-group" aria-label="日夜">
      <button type="button" class="btn" data-mode="day" aria-pressed="true">白天</button>
      <button type="button" class="btn" data-mode="night" aria-pressed="false">夜晚</button>
    </div>
    <button type="button" class="btn" data-play aria-pressed="false">開始動態</button>
    <label class="hc-view-label"><span>視角</span>
      <select class="form-select" data-view aria-label="觀察視角">
        <option value="overview">全景</option>
        <option value="building">建築</option>
        <option value="boat">船隻</option>
        <option value="street">街道與人物</option>
      </select>
    </label>
  </div>
  <div class="hc-stage" role="img" aria-label="溫暖的微縮港灣：錯落高樓、工作船、車輛與簡單人物。可拖曳旋轉、滾輪縮放、右鍵平移，並切換日夜與動態。"></div>
  <div class="hc-footer">
    <span class="text-small text-muted" data-status aria-live="polite">載入 3D 場景中</span>
    <div class="hc-group" aria-label="相機控制">
      <button type="button" class="btn" data-orbit="left" aria-label="向左旋轉">↶</button>
      <button type="button" class="btn" data-orbit="right" aria-label="向右旋轉">↷</button>
      <button type="button" class="btn" data-zoom="in" aria-label="拉近">＋</button>
      <button type="button" class="btn" data-zoom="out" aria-label="拉遠">−</button>
    </div>
  </div>
</div>
<style>
#hc-day-night{color:var(--foreground)}
#hc-day-night .hc-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-right:90px;margin-bottom:10px}
#hc-day-night .hc-group{display:flex;align-items:center;gap:6px}
#hc-day-night .hc-view-label{display:grid;grid-template-columns:auto minmax(120px,1fr);align-items:center;gap:8px}
#hc-day-night .hc-stage{height:610px;width:100%;overflow:hidden;touch-action:none;background:var(--muted)}
#hc-day-night canvas{display:block;width:100%;height:100%}
#hc-day-night .hc-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
@media(max-width:480px){#hc-day-night .hc-toolbar{padding-top:40px;padding-right:0;gap:8px}#hc-day-night .hc-stage{height:490px}}
</style>
